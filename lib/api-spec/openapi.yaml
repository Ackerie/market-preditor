          type: boolean
        dayTradeMaxUsd:
          type: number

    AutoTradeSettingsInput:
      type: object
      properties:
        enabled:
          type: boolean
        riskLevel:
          type: string
          enum: [conservative, moderate, aggressive]
        maxTradeAmountUsd:
          type: number
        intervalMinutes:
          type: integer
        runMode:
          type: string
          enum: [interval, scheduled, continuous]
        scheduledTime:
          type: string
          nullable: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        assetClasses:
          type: string
          pattern: "^(crypto|stock|forex|futures|commodity)(,(crypto|stock|forex|futures|commodity)){0,4}$"
        exitGuardsEnabled:
          type: boolean
        takeProfitPct:
          type: number
          nullable: true
          minimum: 0.1
          maximum: 1000
        stopLossPct:
          type: number
          nullable: true
          minimum: 0.1
          maximum: 99
        dayTradeEnabled:
          type: boolean
        dayTradeMaxUsd:
          type: number
          minimum: 1
          maximum: 1000000

