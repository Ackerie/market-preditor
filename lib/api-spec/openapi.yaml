          avgCostUsd,
          trades,
        ]
      properties:
        symbol:
          type: string
        broker:
          type: string
        realizedPnlUsd:
          type: number
          nullable: true
          description: Realized profit/loss from matched buy→sell round trips (null when fill data is missing)
        buysUsd:
          type: number
        sellsUsd:
          type: number
        openQty:
          type: number
          description: Quantity bought by the bot that has not been sold yet
        avgCostUsd:
          type: number
          nullable: true
          description: Average cost per unit of the remaining open quantity
        trades:
          type: integer

    AutoTradePnl:
      type: object
      required:
        [
          windowDays,
          totalRealizedPnlUsd,
          totalBuysUsd,
          totalSellsUsd,
          netCashFlowUsd,
          executedTrades,
          positions,
        ]
      properties:
        windowDays:
          type: integer
          description: How many days of bot activity the summary covers
        totalRealizedPnlUsd:
          type: number
          nullable: true
          description: Sum of realized P&L across symbols with fill data (null when no trades have fill data)
        totalBuysUsd:
          type: number
        totalSellsUsd:
          type: number
        netCashFlowUsd:
          type: number
          description: Sell proceeds minus buy spend (includes trades without fill data)
        executedTrades:
          type: integer
        positions:
          type: array
          items:
            $ref: "#/components/schemas/AutoTradePnlPosition"

